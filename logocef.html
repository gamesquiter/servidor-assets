<div id="speedo-container" style="position: absolute; bottom: 20px; right: 20px; font-family: sans-serif; color: white;">
    <div style="font-size: 40px; font-weight: bold; text-shadow: 2px 2px 4px #000;">
        <span id="speed">000</span> <small style="font-size: 15px; color: #deff9a;">KM/H</small>
    </div>
    <div id="fuel-bar" style="width: 100px; height: 5px; background: #333; margin-top: 5px;">
        <div id="fuel-level" style="width: 100%; height: 100%; background: #deff9a;"></div>
    </div>
</div>

<script>
    // Função que o Pawn vai chamar
    function updateData(speed, fuel) {
        document.getElementById('speed').innerHTML = speed.toString().padStart(3, '0');
        document.getElementById('fuel-level').style.width = fuel + '%';
    }
</script>
