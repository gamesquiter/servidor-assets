<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocimetro Capital</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: transparent; }
        #speedo-container {
            position: absolute; bottom: 40px; right: 50px;
            text-align: right; user-select: none;
        }
        .speed-text {
            font-family: 'Roboto', sans-serif; font-size: 55px;
            font-weight: 900; color: white; font-style: italic;
            text-shadow: 0px 0px 12px rgba(0,0,0,0.9);
        }
        .kmh-label {
            font-family: 'Orbitron', sans-serif; font-size: 14px;
            color: #deff9a; margin-left: -5px;
        }
        .fuel-container {
            width: 120px; height: 5px; background: rgba(0, 0, 0, 0.5);
            margin-top: -5px; border-radius: 10px; overflow: hidden; float: right;
        }
        #fuel-level {
            width: 100%; height: 100%;
            background: linear-gradient(90deg, #deff9a, #a8ff78);
            transition: width 0.2s linear;
        }
    </style>
</head>
<body>

<div id="speedo-container">
    <div class="speed-text">
        <span id="speed">000</span>
        <span class="kmh-label">KM/H</span>
    </div>
    <div class="fuel-container">
        <div id="fuel-level"></div>
    </div>
</div>

<script>
    // Esta função será disparada pelo Pawn
    function onUpdateData(speed, fuel) {
        // Atualiza o texto da velocidade
        const speedElement = document.getElementById('speed');
        if (speedElement) {
            speedElement.innerText = speed.toString().padStart(3, '0');
        }

        // Atualiza a barra de combustível
        const fuelElement = document.getElementById('fuel-level');
        if (fuelElement) {
            fuelElement.style.width = fuel + '%';
        }
    }

    // REGISTRO DO EVENTO
    window.onload = function() {
        if (typeof cef !== 'undefined') {
            // "updateData" deve ser igual ao nome no Pawn
            cef.on("updateData", onUpdateData);
        } else {
            // Caso o plugin demore a injetar, tenta de novo
            setTimeout(() => {
                if (typeof cef !== 'undefined') {
                    cef.on("updateData", onUpdateData);
                }
            }, 1000);
        }
    };
</script>
</body>
</html>
