<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocimetro Duster</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: transparent; }
        #speedo-container {
            position: absolute; bottom: 40px; right: 50px;
            text-align: right; user-select: none;
        }
        .speed-text {
            font-family: 'Roboto', sans-serif; font-size: 55px;
            font-weight: 900; color: white; font-style: italic;
            text-shadow: 0px 0px 10px rgba(0,0,0,0.8);
        }
        .kmh-label {
            font-family: 'Orbitron', sans-serif; font-size: 14px;
            color: #deff9a; margin-left: -5px;
        }
        .fuel-container {
            width: 120px; height: 4px; background: rgba(0, 0, 0, 0.4);
            margin-top: -5px; border-radius: 10px; overflow: hidden; float: right;
        }
        #fuel-level {
            width: 100%; height: 100%;
            background: linear-gradient(90deg, #deff9a, #a8ff78);
            transition: width 0.3s ease-in-out;
        }
    </style>
</head>
<body>

<div id="speedo-container">
    <div class="speed-text">
        <span id="speed">000</span>
        <span class="kmh-label">KM/H</span>
    </div>
    <div class="fuel-container">
        <div id="fuel-level"></div>
    </div>
</div>

<script>
    // Esta é a função que vai processar os dados
    function atualizarInterface(speed, fuel) {
        document.getElementById('speed').innerText = speed.toString().padStart(3, '0');
        document.getElementById('fuel-level').style.width = fuel + '%';
    }

    // AGUARDA O PLUGIN ESTAR PRONTO
    document.addEventListener("DOMContentLoaded", function() {
        // Tenta registrar o evento assim que possível
        if (typeof cef !== 'undefined') {
            cef.on("v_atualizar", atualizarInterface);
        } else {
            // Se o 'cef' ainda não existir, tenta de novo em 500ms
            setTimeout(() => {
                if (typeof cef !== 'undefined') {
                    cef.on("v_atualizar", atualizarInterface);
                }
            }, 500);
        }
    });
</script>
</body>
</html>
