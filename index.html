<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocimetro Style Capital</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@900&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: transparent; /* Importante para não tapar o jogo */
        }

        #speedo-container {
            position: absolute;
            bottom: 40px;
            right: 50px;
            text-align: right;
            user-select: none;
        }

        .speed-text {
            font-family: 'Roboto', sans-serif;
            font-size: 55px;
            font-weight: 900;
            color: white;
            text-shadow: 0px 0px 10px rgba(0,0,0,0.8);
            letter-spacing: -2px;
            font-style: italic;
        }

        .kmh-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #deff9a;
            margin-left: -5px;
            text-shadow: 0px 0px 0px rgba(222, 255, 154, 0.5);
        }

        .fuel-container {
            width: 120px;
            height: 4px;
            background: rgba(0, 0, 0, 0.4);
            margin-top: -5px;
            border-radius: 10px;
            overflow: hidden;
            float: right;
        }

        #fuel-level {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #deff9a, #a8ff78);
            box-shadow: 0px 0px 7px #deff9a;
            transition: width 0.3s ease-in-out; /* Deixa a barra suave */
        }
    </style>
</head>
<body>

<div id="speedo-container">
    <div class="speed-text">
        <span id="speed">000</span>
        <span class="kmh-label">KM/H</span>
    </div>
    <div class="fuel-container">
        <div id="fuel-level"></div>
    </div>
</div>

<script>
    // Definimos a função globalmente para o CEF encontrar
    window.updateData = function(speed, fuel) {
        // Garantimos que os valores cheguem como números
        const s = parseInt(speed) || 0;
        const f = parseInt(fuel) || 0;

        // Atualiza o texto com 3 dígitos (ex: 005, 080)
        const speedElement = document.getElementById('speed');
        if(speedElement) {
            speedElement.innerText = s.toString().padStart(3, '0');
        }

        // Atualiza a barra de combustível
        const fuelElement = document.getElementById('fuel-level');
        if(fuelElement) {
            fuelElement.style.width = f + '%';
        }
    };

    // Teste de conexão (aparecerá no console do CEF - F12 no jogo)
    console.log("Interface do Velocímetro Carregada e Pronta.");
</script>
</body>
</html>
